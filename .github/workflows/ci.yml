name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default. A job that needs to write (posting a PR comment,
# for example) declares its own `permissions:`, which replaces this one for
# that job rather than adding to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (offline, throwaway attester key)
        run: ATTESTER_PRIVATE_KEY=$(node -e "import('viem/accounts').then(a => console.log(a.generatePrivateKey()))") npm test
